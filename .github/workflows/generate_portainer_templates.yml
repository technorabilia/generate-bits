name: Generate Portainer templates

on:
  workflow_dispatch:
  schedule:
  - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Execute Python script
      run: |
        python generate_portainer_templates.py
    - name: Checkout destination repository
      uses: actions/checkout@v7
      with:
        repository: technorabilia/portainer-templates
        token: ${{ secrets.API_TOKEN_GITHUB }}
        path: portainer-templates

    - name: Copy templates.json into destination repository
      run: |
        mkdir -p portainer-templates/lsio/templates
        cp templates.json portainer-templates/lsio/templates/templates.json

    - name: Commit and push if changed
      working-directory: portainer-templates
      run: |
        git config user.name 'technorabilia'
        git config user.email 'simon@technorabilia.com'
        git add lsio/templates/templates.json
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m 'Sync Portainer templates from LinuxServer.io metadata (generate-bits run ${{ github.run_id }})'
        git push
